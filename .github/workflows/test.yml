name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile the cursor helper
        run: python -m py_compile cursor-tracker.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run pupil math tests
        run: node --test tests/test-eyes.mjs
